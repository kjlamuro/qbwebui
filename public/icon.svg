<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    qBWebUI 图标：上方下载箭头 + 下方自绘 qb 字标。

    合规说明：这里只借用 qBittorrent 的品牌蓝（#2F67BA）作为色系线索，字母 qb
    是以圆角几何笔画独立绘制的，没有引用官方 SVG 资产。官方标识
    src/icons/skin/qbittorrent-tray.svg 以 LGPL 发布，本项目为 MIT，直接引入会
    造成许可证冲突；同时把官方标识用作自家产品图标会构成商标性使用、暗示背书。
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F67BA"/>
      <stop offset="1" stop-color="#4E8FE0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#g)"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 76v124M192 152l64 54 64-54" stroke-width="34"/>
    <!-- q：圆碗 + 下垂尾巴（尾巴必须明显越过圆碗底边，否则会读成 a） -->
    <circle cx="192" cy="364" r="34" stroke-width="24"/>
    <path d="M226 364v68" stroke-width="24"/>
    <!-- b：上伸竖笔 + 圆碗 -->
    <path d="M282 274v90" stroke-width="24"/>
    <circle cx="316" cy="364" r="34" stroke-width="24"/>
  </g>
</svg>
